<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electro AK | إنارة وديكور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F1F0EC;
    --ink:#17181A;
    --muted:#6E6E6E;
    --brass:#B4791F;
    --brass-deep:#8F5F16;
    --brass-soft:#F1E3C6;
    --line:#EAEAE6;
    --whatsapp:#2FAE60;
    --red:#B4432F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:'Tajawal',sans-serif;}

  /* ---------- Nav ---------- */
  .nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 5vw;
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:19px;height:19px;}
  .brand-mark img{height:100%;width:auto;object-fit:contain;display:block;}
  .brand-name{font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.2px;}

  .nav-links{display:flex;gap:22px;font-size:14px;color:var(--ink);font-weight:500;}
  .nav-links a{padding:6px 2px;border-bottom:2px solid transparent;transition:border-color .2s ease;}
  .nav-links a:hover, .nav-links a.active{border-color:var(--ink);font-weight:700;}

  .nav-icons{display:flex;align-items:center;gap:14px;}
  .lang-toggle{font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;letter-spacing:0.5px;}
  .icon-btn{
    position:relative;
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;
    cursor:pointer;transition:opacity .2s ease;
  }
  .icon-btn:hover{opacity:0.6;}
  .icon-btn svg{width:19px;height:19px;stroke:var(--ink);}
  .icon-badge{
    position:absolute;top:-3px;left:-3px;
    background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .search-box{display:none;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:8px 14px;}
  .search-box input{border:none;background:transparent;outline:none;font-family:'Tajawal',sans-serif;font-size:13px;width:140px;color:var(--ink);}
  .search-box.open{display:flex;}
  .search-box svg{width:15px;height:15px;stroke:var(--muted);flex-shrink:0;}

  /* ---------- Promo carousel (hero style) ---------- */
  .promo-carousel{
    position:relative;
    margin:20px 5vw 8px;
    border-radius:16px;
    overflow:hidden;
    background:var(--surface-2);
    aspect-ratio:16/9;
    min-height:340px;
  }
  .promo-slide{
    position:absolute;inset:0;
    opacity:0;
    transition:opacity .7s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .promo-slide.active{opacity:1;}
  .promo-slide img{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
  }
  .promo-slide .ph-icon{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:48px;height:48px;stroke:var(--muted);opacity:0.4;
  }
  .promo-slide::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.35) 45%, rgba(10,10,10,0.15) 100%);
  }
  .promo-overlay{
    position:absolute;inset:0;z-index:2;
    max-width:640px;margin:0 auto;
    padding:0 24px;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .promo-overlay .pretitle{
    color:#F1E3C6;font-size:12.5px;font-weight:600;letter-spacing:0.3px;
  }
  .promo-overlay h3{
    font-family:'Tajawal',sans-serif;font-weight:800;
    font-size:clamp(22px, 3.6vw, 36px);color:#fff;margin:0;line-height:1.35;
  }
  .promo-overlay p{color:#E9E4D8;font-size:13.5px;margin:0;max-width:480px;}
  .promo-cta{
    margin-top:6px;
    background:var(--brass);color:#fff;
    padding:11px 26px;border-radius:999px;
    font-size:13.5px;font-weight:700;border:none;cursor:pointer;
    transition:filter .2s ease;
  }
  .promo-cta:hover{filter:brightness(1.08);}
  .promo-badge{
    position:absolute;bottom:16px;left:16px;z-index:2;
    background:#fff;color:var(--ink);
    padding:8px 18px;border-radius:999px;
    font-size:12.5px;font-weight:700;
  }
  .promo-dots{
    position:absolute;bottom:14px;right:16px;z-index:2;
    display:flex;gap:6px;
  }
  .promo-dots span{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.5);
    transition:background .3s ease, transform .3s ease;
  }
  .promo-dots span.active{background:#fff;transform:scale(1.2);}

  @media (max-width:640px){
    .promo-carousel{aspect-ratio:auto;min-height:300px;}
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:28px 5vw 16px;flex-wrap:wrap;gap:14px;
  }
  .count{font-size:13.5px;color:var(--muted);}
  .count b{color:var(--ink);}
  .toolbar-right{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .sort-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
  .sort-wrap svg{width:15px;height:15px;stroke:var(--ink);}
  select#sortSelect{
    border:none;background:transparent;
    font-size:13px;color:var(--ink);font-weight:700;
    font-family:'Tajawal',sans-serif;cursor:pointer;
  }

  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 5vw 22px;}
  .filter-btn{
    padding:7px 16px;border-radius:999px;border:1px solid var(--line);
    font-size:13px;color:var(--muted);cursor:pointer;background:var(--surface);
    transition:all .2s ease;
  }
  .filter-btn.active, .filter-btn:hover{border-color:var(--ink);color:var(--ink);font-weight:700;}

  /* ---------- Grid ---------- */
  .section{padding:0 5vw 90px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:20px;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 36px -20px rgba(0,0,0,0.18);}

  .card-media{aspect-ratio:1/1;background:var(--surface-2);position:relative;overflow:hidden;}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
  .card:hover .card-media img{transform:scale(1.05);}
  .card-media svg{width:56px;height:56px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);stroke:var(--muted);opacity:0.4;}

  .card-badge{
    position:absolute;top:12px;right:12px;
    background:var(--ink);color:#fff;
    font-size:11px;font-weight:700;padding:6px 13px;border-radius:999px;
    max-width:calc(100% - 60px);
  }
  .wish-btn{
    position:absolute;top:10px;left:10px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.92);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    transition:transform .15s ease;
  }
  .wish-btn:hover{transform:scale(1.08);}
  .wish-btn svg{width:16px;height:16px;stroke:var(--ink);fill:none;transition:fill .2s ease, stroke .2s ease;}
  .wish-btn.active svg{fill:var(--red);stroke:var(--red);}

  .card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .card-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
  .card-name{font-family:'Tajawal',sans-serif;font-size:15.5px;font-weight:700;line-height:1.35;}
  .card-desc{font-size:12.5px;color:var(--muted);line-height:1.6;flex:1;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;}
  .card-price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-price{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;}
  .card-old-price{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);text-decoration:line-through;}
  .add-btn{
    display:flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:8px;
    background:var(--ink);color:#fff;
    font-size:12px;font-weight:700;border:none;cursor:pointer;
    transition:background .2s ease;
  }
  .add-btn:hover{background:var(--brass-deep);}
  .add-btn.added{background:var(--whatsapp);}

  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);border-radius:14px;font-size:14px;grid-column:1/-1;}

  /* ---------- Cart drawer ---------- */
  .cart-overlay{
    position:fixed;inset:0;background:rgba(20,18,14,0.4);
    z-index:90;display:none;
  }
  .cart-overlay.open{display:block;}
  .cart-drawer{
    position:fixed;top:0;bottom:0;left:0;
    width:min(380px, 90vw);
    background:var(--bg);z-index:91;
    transform:translateX(-100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
    box-shadow:20px 0 50px rgba(0,0,0,0.15);
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line);}
  .cart-head h3{font-family:'Tajawal',sans-serif;font-size:18px;margin:0;}
  .close-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cart-items{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
  .cart-item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .cart-item img{width:48px;height:48px;border-radius:7px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .cart-item .ph{width:48px;height:48px;border-radius:7px;background:var(--surface-2);flex-shrink:0;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{font-size:13px;font-weight:700;}
  .cart-item-price{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .qty-control{display:flex;align-items:center;gap:8px;}
  .qty-control button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;}
  .qty-control span{font-size:13px;font-family:'IBM Plex Mono',monospace;min-width:16px;text-align:center;}
  .remove-btn{color:var(--red);font-size:12px;cursor:pointer;background:none;border:none;text-decoration:underline;}
  .cart-empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:13.5px;}
  .cart-foot{padding:18px 20px;border-top:1px solid var(--line);}
  .cart-total{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;}
  .cart-total b{font-family:'IBM Plex Mono',monospace;font-size:16px;}
  .checkout-btn{
    width:100%;padding:13px;border-radius:10px;border:none;
    background:var(--whatsapp);color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  }
  .checkout-btn:hover{filter:brightness(1.06);}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line);padding:36px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px;}

  @media (max-width:760px){
    .nav-links{display:none;}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:repeat(2, 1fr);gap:12px;}
    .card-body{padding:10px 10px 12px;}
    .card-name{font-size:13.5px;}
    .card-desc{display:none;}
    .add-btn{padding:7px 10px;font-size:11px;}
  }
</style>
</head>
<body>

<nav class="nav">

<!-- سلايدر ترويجي متحرك تلقائياً (صور فقط)، والنص فوقه ثابت. عدّل الصور من PROMO_IMAGES والنص من PROMO_HERO أسفل الملف -->
<div class="promo-carousel" id="promoCarousel"></div>

<script>
/* ==================================================================
   منتجاتك: أضف/عدّل/احذف منتج بتعديل القائمة أدناه.
   كل منتج له: id (رقم فريد)، name، price، description، image (اسم ملف
   الصورة إذا رفعتها بنفس مجلد الموقع، أو رابط كامل)، category، badge (اختياري)
   ================================================================== */
/* ==================================================================
   السلايدر الترويجي:
   - PROMO_IMAGES: الصور اللي تتحرك وتتبدّل تلقائياً بالخلفية.
   - PROMO_HERO: النص الثابت اللي يبقى ظاهر فوق الصور طول الوقت.
   ================================================================== */
const PROMO_IMAGES = ['promo-3.jpg', 'promo-side.jpg'];
const PROMO_HERO = {
  pretitle: 'إلى منزل تشعر أنه صُنع لك بالضبط',
  title: 'هدفنا تغيير منزلك للأفضل',
  subtitle: '',
  buttonText: 'تسوّق الآن'
};
const PROMO_INTERVAL_MS = 2000;

function initPromoCarousel(){
  const el = document.getElementById('promoCarousel');
  if(!el || PROMO_IMAGES.length === 0) return;

  const slidesHtml = PROMO_IMAGES.map((src, i) => `
    <div class="promo-slide ${i===0?'active':''}" data-index="${i}">
      <img src="${escapeAttr(src)}" alt="" onerror="this.style.display='none';">
    </div>
  `).join('');

  const dotsHtml = PROMO_IMAGES.length > 1 ? `
    <div class="promo-dots">
      ${PROMO_IMAGES.map((_, i) => `<span class="${i===0?'active':''}" data-dot="${i}"></span>`).join('')}
    </div>` : '';

  const heroHtml = PROMO_HERO.title ? `
    <div class="promo-overlay">
      ${PROMO_HERO.pretitle ? `<span class="pretitle">${escapeHtml(PROMO_HERO.pretitle)}</span>` : ''}
      <h3>${escapeHtml(PROMO_HERO.title)}</h3>
      ${PROMO_HERO.subtitle ? `<p>${escapeHtml(PROMO_HERO.subtitle)}</p>` : ''}
      ${PROMO_HERO.buttonText ? `<button class="promo-cta" onclick="document.getElementById('collection').scrollIntoView({behavior:'smooth'})">${escapeHtml(PROMO_HERO.buttonText)}</button>` : ''}
    </div>` : '';

  el.innerHTML = slidesHtml + dotsHtml + heroHtml;

  if(PROMO_IMAGES.length <= 1) return;

  let current = 0;
  setInterval(()=>{
    const slides = el.querySelectorAll('.promo-slide');
    const dots = el.querySelectorAll('.promo-dots span');
    slides[current].classList.remove('active');
    dots[current]?.classList.remove('active');
    current = (current + 1) % PROMO_IMAGES.length;
    slides[current].classList.add('active');
    dots[current]?.classList.add('active');
  }, PROMO_INTERVAL_MS);
}

const PRODUCTS = [
  {
    id: '1',

    price: 55,
    description: 'إضاءة LED ذكية بثلاث درجات إضاءة قابلة للتبديل، مزوّدة بمستشعر حركة تلقائي يضيء عند اقترابك، وشحن عبر منفذ Type-C دون الحاجة لأي أسلاك دائمة.',

  },
  {

    name: 'لد للمطبخ',

    image: 'promo-4.jpg',
    category: 'إنارة',
    badge: 'الكمية محدودة',
    active: true
  },
  {
    id: '3',
    name: 'صاعق الناموس',
    price: 95,
    description: 'صاعق كهربائي فعّال للقضاء على الناموس والحشرات الطائرة، بتصميم خفيف وسهل الاستخدام بيد واحدة، ويعمل بشحن Type-C دون الحاجة لبطاريات.',
    image: 'promo-5.jpg',
    category: 'أدوات منزلية',
    badge: '',
    active: true
  },
  {
    id: '4',

// رقم الواتساب بصيغة دولية بدون + أو أصفار في البداية (مثال: 218912345678)
const WHATSAPP_NUMBER = '218919547085';

let allProducts = PRODUCTS;
let activeCategory = 'الكل';
let searchTerm = '';
let cart = {}; // { productId: qty }
let wishlist = new Set();
let showingWishlistOnly = false;

const placeholderIcon = `
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 2h6l1 6h-8l1-6z"/>
    <path d="M8 8c0 4 1.5 6 1.5 6h5S16 12 16 8"/>
    <path d="M10.5 14h3l.8 4h-4.6l.8-4z"/>
    <path d="M8.5 20.5h7"/>
  </svg>`;

function money(n){
  const num = Number(n) || 0;
  return num.toLocaleString('en-US', {maximumFractionDigits:2}) + ' د.ل';
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Search / filters ---------- */
function toggleSearch(){
  document.getElementById('searchBox').classList.toggle('open');
  document.getElementById('searchInput').focus();
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('searchInput')?.addEventListener('input', e=>{
    searchTerm = e.target.value.trim().toLowerCase();
    renderGrid();
  });
});

function renderFilters(){
  const cats = ['الكل', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
  const wrap = document.getElementById('filters');
  wrap.innerHTML = cats.map(c =>
    `<button class="filter-btn ${c===activeCategory && !showingWishlistOnly ?'active':''}" onclick="setCategory('${escapeAttr(c)}')">${escapeHtml(c)}</button>`
  ).join('');
}
function setCategory(c){
  activeCategory = c;
  showingWishlistOnly = false;
  renderFilters();
  renderGrid();
  document.getElementById('collection').scrollIntoView({behavior:'smooth'});
}
function toggleWishlistView(){
  showingWishlistOnly = !showingWishlistOnly;
  renderGrid();
  document.getElementById('collection').scrollIntoView({behavior:'smooth'});
}

/* ---------- Wishlist ---------- */
function toggleWishlist(id, e){
  e.stopPropagation();
  if(wishlist.has(id)) wishlist.delete(id); else wishlist.add(id);
  renderGrid();
}

/* ---------- Grid ---------- */
function renderGrid(){
  const grid = document.getElementById('productGrid');
  let list = allProducts.filter(p => {
    const isActive = String(p.active).toLowerCase() !== 'false' && String(p.active) !== '0';
    const matchCat = activeCategory === 'الكل' || p.category === activeCategory;
    const matchSearch = !searchTerm || (p.name||'').toLowerCase().includes(searchTerm) || (p.description||'').toLowerCase().includes(searchTerm);
    const matchWish = !showingWishlistOnly || wishlist.has(String(p.id));
    return isActive && matchCat && matchSearch && matchWish;
  });

  const sort = document.getElementById('sortSelect').value;
  if(sort === 'price_asc') list = [...list].sort((a,b)=>(Number(a.price)||0)-(Number(b.price)||0));
  else if(sort === 'price_desc') list = [...list].sort((a,b)=>(Number(b.price)||0)-(Number(a.price)||0));
  else if(sort === 'newest') list = [...list].sort((a,b)=> String(a.id).localeCompare(String(b.id)));
  else list = [...list];

  document.getElementById('productCount').textContent = list.length;

  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state">${showingWishlistOnly ? 'لا توجد منتجات في المفضلة بعد' : 'لا توجد منتجات في هذا القسم حالياً'}</div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const id = String(p.id);
    const isWished = wishlist.has(id);
    const inCart = cart[id] > 0;
    return `
    <div class="card">
      <div class="card-media">
        ${p.image ? `<img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}" loading="lazy">` : placeholderIcon}
        ${p.badge ? `<div class="card-badge">${escapeHtml(p.badge)}</div>` : ''}
        <button class="wish-btn ${isWished?'active':''}" onclick="toggleWishlist('${id}', event)" aria-label="أضف للمفضلة">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.6 5 6 5c2 0 3.4 1.1 4 2.2C10.6 6.1 12 5 14 5c3.4 0 5.2 3.6 3.5 7-2.5 4.4-9.5 9-9.5 9z"/></svg>
        </button>
      </div>
      <div class="card-body">
        ${p.category ? `<div class="card-cat">${escapeHtml(p.category)}</div>` : ''}
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-desc">${escapeHtml(p.description || '')}</div>
        <div class="card-foot">
          <div class="card-price-row">
            ${p.oldPrice ? `<span class="card-old-price">${money(p.oldPrice)}</span>` : ''}
            <span class="card-price">${money(p.price)}</span>
          </div>
          <button class="add-btn ${inCart?'added':''}" onclick="addToCart('${id}')">
            ${inCart ? 'أُضيف (' + cart[id] + ')' : '+ أضف للسلة'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- Cart ---------- */
function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  updateCartBadge();
  renderGrid();
  renderCart();
}
function changeQty(id, delta){
  cart[id] = (cart[id] || 0) + delta;
  if(cart[id] <= 0) delete cart[id];
  updateCartBadge();
  renderGrid();
  renderCart();
}
function removeFromCart(id){
  delete cart[id];
  updateCartBadge();
  renderGrid();
  renderCart();
}
function updateCartBadge(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const badge = document.getElementById('cartBadge');
  if(count > 0){ badge.style.display='flex'; badge.textContent = count; }
  else { badge.style.display='none'; }
}
function openCart(){
  renderCart();
  document.getElementById('cartOverlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
}
function renderCart(){
  const box = document.getElementById('cartItemsBox');
  const foot = document.getElementById('cartFoot');
  const entries = Object.entries(cart).filter(([id,qty])=>qty>0);

  if(entries.length === 0){
    box.innerHTML = '<div class="cart-empty">سلتك فارغة حالياً</div>';
    foot.style.display = 'none';
    return;
  }

  let total = 0;
  box.innerHTML = entries.map(([id, qty])=>{
    const p = allProducts.find(pr => String(pr.id) === id);
    if(!p) return '';
    const lineTotal = (Number(p.price)||0) * qty;
    total += lineTotal;
    return `
      <div class="cart-item">
        ${p.image ? `<img src="${escapeAttr(p.image)}" alt="">` : '<div class="ph"></div>'}
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHtml(p.name)}</div>
          <div class="cart-item-price">${money(p.price)}</div>
          <button class="remove-btn" onclick="removeFromCart('${id}')">إزالة</button>
        </div>
        <div class="qty-control">
          <button onclick="changeQty('${id}', -1)">−</button>
          <span>${qty}</span>
          <button onclick="changeQty('${id}', 1)">+</button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('cartTotal').textContent = money(total);
  foot.style.display = 'block';
}

function checkoutWhatsapp(){
  const entries = Object.entries(cart).filter(([id,qty])=>qty>0);
  if(entries.length === 0) return;
  let total = 0;
  let lines = entries.map(([id, qty])=>{
    const p = allProducts.find(pr => String(pr.id) === id);
    if(!p) return '';
    const lineTotal = (Number(p.price)||0) * qty;
    total += lineTotal;
    return `- ${p.name} × ${qty} = ${money(lineTotal)}`;
  }).filter(Boolean).join('\n');
  const msg = `مرحباً، أرغب بطلب التالي:\n${lines}\n\nالإجمالي: ${money(total)}`;
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
}

/* ---------- Load ---------- */
function loadProducts(){
  renderFilters();
  renderGrid();
}

initPromoCarousel();
loadProducts();
</script>
