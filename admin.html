<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | أضواء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130F; --surface:#1E1A14; --surface-2:#262019;
    --ink:#F2EAD8; --muted:#9C9280;
    --brass:#C89B4A; --brass-bright:#E8C378;
    --line:rgba(242,234,216,0.10);
    --red:#C15B4A; --green:#3FA65C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 80px;}

  /* Gate */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:360px;width:100%;text-align:center;}
  .gate-card h1{font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px;}
  .gate-card p{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .gate-card input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;margin-bottom:12px;font-family:'Manrope',sans-serif;}
  .gate-card .err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px;}

  h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}

  .btn{border:1px solid var(--brass);background:transparent;color:var(--ink);border-radius:8px;padding:9px 18px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s ease;}
  .btn:hover{background:var(--brass);color:var(--bg);}
  .btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500;}
  .btn.danger{border-color:var(--red);color:var(--red);}
  .btn.danger:hover{background:var(--red);color:#fff;}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:22px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-family:'Manrope',sans-serif;font-size:14px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field.full{grid-column:1/-1;}
  .checkbox-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px;}
  .checkbox-field input{width:auto;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}

  .status{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;}
  .status.ok{background:rgba(63,166,92,0.15);color:var(--green);}
  .status.error{background:rgba(193,91,74,0.15);color:var(--red);}

  .list{display:flex;flex-direction:column;gap:12px;}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center;}
  .item img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .item .ph{width:56px;height:56px;border-radius:8px;background:var(--surface-2);flex-shrink:0;}
  .item-info{flex:1;min-width:0;}
  .item-name{font-weight:700;font-size:14px;}
  .item-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .item-price{font-family:'IBM Plex Mono',monospace;color:var(--brass-bright);font-size:14px;}
  .item-actions{display:flex;gap:6px;flex-shrink:0;}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .badge.inactive{color:var(--red);border-color:var(--red);}

  .empty{text-align:center;color:var(--muted);padding:40px;border:1px dashed var(--line);border-radius:12px;font-size:14px;}
  .loading{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
</style>
</head>
<body>

<div id="gateView" class="gate">
  <div class="gate-card">
    <h1>لوحة تحكم أضواء</h1>
    <p>أدخل كلمة المرور للدخول</p>
    <div class="err" id="gateErr"></div>
    <input type="password" id="gatePassword" placeholder="كلمة المرور">
    <button class="btn" style="width:100%" onclick="checkPassword()">دخول</button>
  </div>
</div>

<div id="appView" class="wrap" style="display:none;">
  <div class="top">
    <div>
      <h1>لوحة التحكم</h1>
      <div class="sub">أضف وعدّل وأخفِ منتجاتك — التغييرات تظهر مباشرة بالموقع</div>
    </div>
    <button class="btn" onclick="showForm()">+ إضافة منتج</button>
  </div>

  <div id="statusBox"></div>
  <div id="formSlot"></div>
  <div id="listBox"><div class="loading">جارِ تحميل المنتجات...</div></div>
</div>

<script>
// نفس رابط Google Apps Script المستخدم في الموقع العام
const API_URL = 'https://script.google.com/macros/s/AKfycbzkvLMOPkC85F6xP_dVf2uT4jisX7StOE3e57yvGIo/dev';

// غيّر كلمة المرور هذه لأي شيء تحفظه لنفسك
const ADMIN_PASSWORD = 'asdf1020304050';

let products = [];
let editingId = null;

function checkPassword(){
  const val = document.getElementById('gatePassword').value;
  if(val === ADMIN_PASSWORD){
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    loadProducts();
  } else {
    document.getElementById('gateErr').textContent = 'كلمة المرور غير صحيحة';
  }
}
document.getElementById('gatePassword').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkPassword();
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }
function money(n){
  const num = Number(n) || 0;
  return num.toLocaleString('en-US', {maximumFractionDigits:2}) + ' د.ل';
}

function showStatus(msg, type){
  const box = document.getElementById('statusBox');
  box.innerHTML = `<div class="status ${type}">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ box.innerHTML = ''; }, 4000);
}

async function apiGet(){
  const res = await fetch(API_URL);
  if(!res.ok) throw new Error('فشل الاتصال');
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('فشل الاتصال');
  return res.json();
}

async function loadProducts(){
  const listBox = document.getElementById('listBox');
  if(API_URL.includes('PASTE_YOUR')){
    listBox.innerHTML = '<div class="empty">لم يتم ربط اللوحة بقاعدة البيانات بعد. راجع ملف التعليمات لإضافة رابط Google Apps Script.</div>';
    return;
  }
  listBox.innerHTML = '<div class="loading">جارِ تحميل المنتجات...</div>';
  try{
    products = await apiGet();
    renderList();
  }catch(e){
    listBox.innerHTML = '<div class="empty">تعذّر تحميل المنتجات. تأكد من صحة رابط قاعدة البيانات.</div>';
  }
}

function renderList(){
  const listBox = document.getElementById('listBox');
  if(products.length === 0){
    listBox.innerHTML = '<div class="empty">لا توجد منتجات بعد. اضغط "إضافة منتج" لتبدأ.</div>';
    return;
  }
  listBox.innerHTML = `<div class="list">${products.map(p=>{
    const isActive = String(p.active).toLowerCase() !== 'false' && String(p.active) !== '0';
    return `
    <div class="item">
      ${p.image ? `<img src="${escapeAttr(p.image)}" alt="">` : '<div class="ph"></div>'}
      <div class="item-info">
        <div class="item-name">${escapeHtml(p.name)} ${!isActive ? '<span class="badge inactive">مخفي</span>' : ''}</div>
        <div class="item-meta">${escapeHtml(p.category || 'بدون قسم')}</div>
      </div>
      <div class="item-price">${money(p.price)}</div>
      <div class="item-actions">
        <button class="btn small ghost" onclick="editProduct('${p.id}')">تعديل</button>
        <button class="btn small danger" onclick="deleteProduct('${p.id}')">حذف</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function showForm(product){
  editingId = product ? product.id : null;
  const slot = document.getElementById('formSlot');
  slot.innerHTML = `
    <div class="form-card">
      <div class="form-grid">
        <div class="field"><label>اسم المنتج</label><input id="f_name" type="text" value="${escapeAttr(product?.name || '')}" placeholder="مثال: مصباح طاولة نحاسي"></div>
        <div class="field"><label>السعر</label><input id="f_price" type="number" min="0" value="${escapeAttr(product?.price ?? '')}" placeholder="0"></div>
        <div class="field"><label>القسم</label><input id="f_category" type="text" value="${escapeAttr(product?.category || '')}" placeholder="مثال: إنارة"></div>
        <div class="field"><label>شارة المنتج (اختياري)</label><input id="f_badge" type="text" value="${escapeAttr(product?.badge || '')}" placeholder="مثال: الأكثر مبيعاً"></div>
        <div class="field"><label>رابط الصورة (اختياري)</label><input id="f_image" type="text" value="${escapeAttr(product?.image || '')}" placeholder="https://..."></div>
        <div class="field full"><label>وصف قصير</label><textarea id="f_description" placeholder="خامة، مقاس، تفاصيل مختصرة">${escapeHtml(product?.description || '')}</textarea></div>
      </div>
      <label class="checkbox-field">
        <input type="checkbox" id="f_active" ${product && (String(product.active).toLowerCase()==='false') ? '' : 'checked'}>
        منتج ظاهر في الموقع
      </label>
      <div class="form-actions">
        <button class="btn ghost" onclick="closeForm()">إلغاء</button>
        <button class="btn" id="saveBtn" onclick="saveProduct()">${product ? 'حفظ التعديلات' : 'إضافة المنتج'}</button>
      </div>
    </div>
  `;
  slot.scrollIntoView({behavior:'smooth', block:'center'});
}

function closeForm(){
  editingId = null;
  document.getElementById('formSlot').innerHTML = '';
}

function editProduct(id){
  const p = products.find(p=>String(p.id)===String(id));
  if(p) showForm(p);
}

async function saveProduct(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('اكتب اسم المنتج'); return; }
  const productData = {
    name,
    price: Number(document.getElementById('f_price').value) || 0,
    category: document.getElementById('f_category').value.trim(),
    badge: document.getElementById('f_badge').value.trim(),
    image: document.getElementById('f_image').value.trim(),
    description: document.getElementById('f_description').value.trim(),
    active: document.getElementById('f_active').checked ? 'true' : 'false'
  };

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  try{
    if(editingId){
      await apiPost({ action:'update', id: editingId, product: productData });
      showStatus('تم حفظ التعديلات', 'ok');
    } else {
      await apiPost({ action:'add', product: productData });
      showStatus('تمت إضافة المنتج', 'ok');
    }
    closeForm();
    await loadProducts();
  }catch(e){
    showStatus('حدث خطأ أثناء الحفظ، حاول مرة أخرى', 'error');
    btn.disabled = false;
    btn.textContent = editingId ? 'حفظ التعديلات' : 'إضافة المنتج';
  }
}

async function deleteProduct(id){
  const p = products.find(p=>String(p.id)===String(id));
  if(!p) return;
  if(!confirm('حذف "'+p.name+'" نهائياً؟')) return;
  try{
    await apiPost({ action:'delete', id });
    showStatus('تم حذف المنتج', 'ok');
    await loadProducts();
  }catch(e){
    showStatus('تعذّر الحذف، حاول مرة أخرى', 'error');
  }
}
</script>
</body>
</html>
